name: Build e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Criar pastas e arquivos base se faltarem
        run: |
          mkdir -p data/categories data/work media
          [ -f data/site.json ] || printf '{"name":"Gustavo Oliveira","role":"","bio":"","email":"","instagram":"","behance":"","linkedin":"","location":"","aboutTitle":"","aboutText1":"","aboutText2":"","aboutImage":"","profileImage":"","servicesTitle":"","contactTitle":"","contactText":""}\n' > data/site.json

      - name: Gerar projects.json e lista de mídia
        run: python scripts/build_site.py

      - name: Salvar arquivos gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "Atualiza arquivos gerados [skip ci]"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - id: deployment
        uses: actions/deploy-pages@v4
